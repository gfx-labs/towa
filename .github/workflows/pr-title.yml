name: pr-title

# Master is squash-only and the PR title becomes the commit subject,
# which release-please reads: titles must be conventional
# commits. pull_request_target so edits to the title rerun the check;
# it reads only the title and checks out no code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: talos-metal-gfx
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary "{subject}" in the PR title "{title}" must not
            start with an uppercase letter.
