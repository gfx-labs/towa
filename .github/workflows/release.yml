name: release

# release-please keeps one release PR open with the next 0.x version and
# CHANGELOG. Ordinary merges only update it; merging the release
# PR tags the release, which is the Go module version.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: talos-metal-gfx
    # The App key is a secret of the release environment, which only
    # master may deploy to.
    environment: release
    steps:
      # An App token, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN gets
      # no CI runs, so the required checks never report on the release PR.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Hand-written release notes live in docs/notes/<date>-release-vX.Y.Z.md.
      # Append a link to the matching note, if any, to the release.
      - uses: actions/checkout@v5
        if: steps.rp.outputs.release_created
      - name: link release notes
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          note=$(ls docs/notes/*-release-"$TAG".md 2>/dev/null | head -1)
          [ -n "$note" ] || exit 0
          body=$(gh release view "$TAG" --json body -q .body)
          printf '%s\n\nRelease notes: %s/%s/blob/%s/%s\n' "$body" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" "$note" |
            gh release edit "$TAG" --notes-file -
      # Static binaries for the targets the Nix package builds, one tarball
      # each, with their sha256 sums. The tag is the version the binary
      # reports: a build from a checkout has no module version to read.
      - uses: actions/setup-go@v6
        if: steps.rp.outputs.release_created
        with:
          go-version-file: go.mod
      - name: attach binaries
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name=towa_${TAG#v}_${os}_${arch}
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/gfx-labs/towa/src/cli.buildVersion=$TAG" \
              -o "dist/$name/towa" ./cmd/towa
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt)
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt
