name: release

# release-please keeps one release PR open with the next 0.x version and
# CHANGELOG. Ordinary merges only update it; merging the release
# PR tags the release, which is the Go module version.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: talos-metal-gfx-public
    # The App key is a secret of the release environment, which only
    # master may deploy to.
    environment: release
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # An App token, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN gets
      # no CI runs, so the required checks never report on the release PR.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v5
        if: steps.rp.outputs.release_created
      # Static binaries for the targets the Nix package builds, one tarball
      # each, with their sha256 sums. The tag is the version the binary
      # reports: a build from a checkout has no module version to read.
      - uses: actions/setup-go@v6
        if: steps.rp.outputs.release_created
        with:
          go-version-file: go.mod
      - name: attach binaries
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            name=towa_${TAG#v}_${os}_${arch}
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/gfx-labs/towa/src/cli.buildVersion=$TAG" \
              -o "dist/$name/towa" ./cmd/towa
            cp LICENSE README.md "dist/$name/"
            # The runner workspace is setgid, and extracting a setgid
            # directory fails with EPERM where setgid is restricted
            # (systemd RestrictSUIDSGID, which mise installs hit).
            tar -C dist --mode=g-s --owner=0 --group=0 --numeric-owner \
              -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt)
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt

  # The macOS binaries are built and the native one started on macOS, so a
  # release does not ship one that only cross-compiles. checksums.txt then
  # gets their sums.
  darwin:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: nscloud-macos-tahoe-arm64-6x14
    environment: release
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: attach binaries
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir dist
          for arch in arm64 amd64; do
            name=towa_${TAG#v}_darwin_${arch}
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/gfx-labs/towa/src/cli.buildVersion=$TAG" \
              -o "dist/$name/towa" ./cmd/towa
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          dist/towa_${TAG#v}_darwin_arm64/towa --version
          gh release download "$TAG" -p checksums.txt -D dist
          (cd dist && shasum -a 256 ./*.tar.gz | sed 's| \./| |' >> checksums.txt)
          gh release upload --clobber "$TAG" dist/*.tar.gz dist/checksums.txt
