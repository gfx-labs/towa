name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push cancels the running CI for the same PR. Master runs are not
# cancelled, so every master commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  go:
    runs-on: talos-metal-gfx
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The release binaries are static. A cgo dependency fails here.
      - name: static build
        run: CGO_ENABLED=0 go build ./...
      # macOS is a headless build target. Nothing runs there in CI.
      - name: macOS build
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./... && GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go vet ./...
      # go test -json goes to a file and is printed from it unfiltered. rc
      # keeps the test exit code.
      - name: tests
        run: |
          go test -json -race ./... > test.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test.json
          exit "${rc:-0}"
      # tools/conformance is its own module too. It builds the binary and
      # drives it over stdio with coder/acp-go-sdk as the client, so a second
      # implementation checks what we put on the wire.
      - name: conformance
        run: |
          go -C tools/conformance vet ./...
          go -C tools/conformance test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      # The modules under tools/ are not part of ./... and are linted apart.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: tools/conformance
