name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push cancels the running CI for the same PR. Master runs are not
# cancelled, so every master commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  go:
    runs-on: talos-metal-gfx
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The release binaries are static. A cgo dependency fails here.
      - name: static build
        run: CGO_ENABLED=0 go build ./...
      # macOS is a headless build target. Nothing runs there in CI.
      - name: macOS build
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./... && GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go vet ./...
      # pkg/acp/*_gen.go must be what tools/acpgen writes for the schema
      # files in the repo.
      - name: generated code is current
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # The search tools run ripgrep and have no fallback, so their tests
      # need the real binary. The version and checksum are pinned.
      - name: install ripgrep
        env:
          RG_VERSION: 14.1.1
          RG_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        run: |
          name="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/rg.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${name}.tar.gz"
          echo "${RG_SHA256}  ${RUNNER_TEMP}/rg.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/rg"
          tar --extract --gzip --file "${RUNNER_TEMP}/rg.tar.gz" --directory "${RUNNER_TEMP}/rg" --strip-components 1 "${name}/rg"
          echo "${RUNNER_TEMP}/rg" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/rg/rg" --version
      # go test -json goes to a file and is printed from it unfiltered. rc
      # keeps the test exit code.
      - name: tests
        run: |
          go test -json -race ./... > test.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test.json
          exit "${rc:-0}"
      # tools/acpgen is its own module, so ./... above does not reach it.
      - name: generator tests
        working-directory: tools/acpgen
        run: |
          go vet ./...
          go test ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
